[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdge-microgrid"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.26",
  "pandas>=2.1",
  "torch>=2.1",
  "stable-baselines3>=2.3",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

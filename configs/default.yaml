env_id: SDGEMicrogridPSPS-v0
gamma: 0.99
train_timesteps: 1000000
n_seeds: 5
eval_episodes_per_seed: 20
eval_normal: 10
eval_highrisk: 10
w_flex: 1.50
w_crit: 25.00
rho_reserve_threshold: 0.25
data_dir: data/processed
results_dir: results
device: cuda
tide:
  image: pytorch-notebook
  gpu_type: L40
  cpus: 8
  mem_gb: 32
  gpus_per_job: 1
  avoid_gpu_advanced_a100: true
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
sac:
  learning_rate: 3.0e-4
  buffer_size: 100000
  batch_size: 256
  learning_starts: 1000
